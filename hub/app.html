<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#073B5C">
  <title>CURIOS Project Hub</title>
  <link rel="icon" href="../img/icon.svg">
  <link rel="stylesheet" href="../css/hub.css">
</head>
<body>
  <header class="hub-topbar" id="hub-topbar"></header>

  <main class="hub-main" id="hub-content">
    <div class="hub-empty">
      <div class="hub-empty-icon">⏳</div>
      <div class="hub-empty-title">Chargement…</div>
    </div>
  </main>

  <script src="../js/hub-auth.js"></script>
  <script src="../js/hub-api.js"></script>
  <script src="../js/hub-shell.js"></script>
  <script src="../js/hub-pages/dashboard.js"></script>
  <script src="../js/hub-pages/projets.js"></script>
  <script src="../js/hub-pages/parcours.js"></script>
  <script src="../js/hub-pages/packs.js"></script>
  <script src="../js/hub-pages/sessions.js"></script>
  <script src="../js/hub-pages/clients.js"></script>
  <script src="../js/hub-pages/materiel.js"></script>
  <script src="../js/hub-pages/planning.js"></script>
  <script src="../js/hub-pages/commercial.js"></script>
  <script src="../js/hub-pages/analytics.js"></script>
  <script>
    (function () {
      HubShell.registerPage("dashboard", renderDashboard);
      HubShell.registerPage("projets", renderProjets);
      HubShell.registerPage("parcours", renderParcours);
      HubShell.registerPage("packs", renderPacks);
      HubShell.registerPage("sessions", renderSessions);
      HubShell.registerPage("clients", renderClients);
      HubShell.registerPage("materiel", renderMateriel);
      HubShell.registerPage("planning", renderPlanning);
      HubShell.registerPage("commercial", renderCommercial);
      HubShell.registerPage("analytics", renderAnalytics);

      HubShell.registerPage("settings", function (user) {
        return (
          '<div class="hub-page-header">' +
          '<div><h1 class="hub-page-title">⚙️ Settings</h1>' +
          '<p class="hub-page-sub">Paramètres du Hub et de votre compte</p></div></div>' +
          '<div class="hub-grid">' +
          '<div class="hub-card">' +
          '<div class="hub-card-header"><h2>👤 Profil</h2></div>' +
          '<div class="hub-form-group"><label class="hub-form-label">Nom</label>' +
          '<input class="hub-form-input" type="text" value="' +
          HubShell.escHtml(user ? user.name : "") + '" id="settings-name"></div>' +
          '<div class="hub-form-group"><label class="hub-form-label">Email</label>' +
          '<input class="hub-form-input" type="email" value="' +
          HubShell.escHtml(user ? user.email : "") + '" readonly></div>' +
          '<div class="hub-form-group"><label class="hub-form-label">Rôle</label>' +
          '<input class="hub-form-input" type="text" value="' +
          HubShell.escHtml(user ? user.role : "") + '" readonly></div>' +
          '<button class="hub-btn hub-btn-primary" data-page-action="save-settings">💾 Enregistrer</button>' +
          "</div>" +
          '<div class="hub-card">' +
          '<div class="hub-card-header"><h2>🔗 Liens rapides</h2></div>' +
          '<div class="hub-quick-actions" style="flex-direction:column;">' +
          '<a class="hub-quick-action" href="../player/dashboard.html"><span class="qa-icon">🎛️</span><span class="qa-label">Dashboard organisateur</span></a>' +
          '<a class="hub-quick-action" href="../player/editeur.html"><span class="qa-icon">✏️</span><span class="qa-label">Éditeur de contenu</span></a>' +
          '<a class="hub-quick-action" href="../player/studio.html"><span class="qa-icon">🎨</span><span class="qa-label">Studio de création</span></a>' +
          '<a class="hub-quick-action" href="../player/atelier.html"><span class="qa-icon">🧩</span><span class="qa-label">Atelier de packs</span></a>' +
          '<a class="hub-quick-action" href="../player/"><span class="qa-icon">▶️</span><span class="qa-label">Lancer le player</span></a>' +
          "</div></div></div>"
        );
      });

      HubShell.init();
    })();
  </script>
</body>
</html>
