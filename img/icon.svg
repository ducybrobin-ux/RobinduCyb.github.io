<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Curi{s}">

  <defs>
    <linearGradient id="route" x1="100" y1="80" x2="350" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00A6A6"></stop>
      <stop offset="0.55" stop-color="#20B878"></stop>
      <stop offset="1" stop-color="#F5A623"></stop>
    </linearGradient>
  </defs>

  <!-- C / parcours -->
  <path d="M280 140
       C240 80 170 70 130 110
       C70 170 50 270 60 340
       C75 430 140 480 220 480
       C300 480 350 440 380 370"
       fill="none" stroke="#073B5C" stroke-width="48" stroke-linecap="round"/>

  <!-- trajectoire -->
  <path d="M100 360
       C140 400 200 420 270 400
       C340 380 360 320 360 260
       C360 190 320 140 270 120
       C220 100 170 110 140 140"
       fill="none" stroke="url(#route)" stroke-width="28" stroke-linecap="round"/>

  <!-- point de départ -->
  <circle cx="105" cy="358" r="22" fill="#073B5C"/>

  <!-- destination / repère -->
  <path d="M280 90
       C255 90 235 115 235 145
       C235 195 280 250 280 250
       C280 250 325 195 325 145
       C325 115 305 90 280 90Z"
       fill="#F5A623"/>
  <circle cx="280" cy="140" r="18" fill="#073B5C"/>

</svg>
